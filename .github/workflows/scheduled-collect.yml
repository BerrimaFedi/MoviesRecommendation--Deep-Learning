# Bonus — exécution planifiée de la collecte : rafraîchit le cache TMDB (conditions : 6 mois max),
# rejoue le pipeline, vérifie la dérive et pousse les nouvelles données vers le remote DVC.
# Prérequis (Settings → Secrets) : TMDB_READ_TOKEN, et les identifiants du remote DVC
# (ex. GDRIVE_CREDENTIALS_DATA pour Google Drive, ou AWS_* pour S3). Sans secret, le job s'arrête proprement.
name: scheduled-collect

on:
  schedule:
    - cron: "0 3 1 * *"     # le 1er de chaque mois à 03:00 UTC
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
      GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
    steps:
      - name: Secrets présents ?
        id: guard
        run: |
          if [ -z "$TMDB_READ_TOKEN" ]; then echo "TMDB_READ_TOKEN absent : collecte ignorée"; echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.13"
          cache: pip
      - name: Collecte et reconstruction
        if: steps.guard.outputs.skip != 'true'
        run: |
          pip install -r requirements.txt
          dvc pull || echo "premier remplissage du remote"
          dvc repro
          python -m src.reporting.drift
          dvc push
      - name: Rapport
        if: steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: reports/
